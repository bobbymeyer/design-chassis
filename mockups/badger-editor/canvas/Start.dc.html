<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: oklch(54% 0.006 95); } a:hover { color: oklch(18% 0.006 95); }
  </style>
</helmet>
<div style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; width: 1440px; height: 900px; background: oklch(98% 0.006 95); color: oklch(18% 0.006 95); font-size: 16px; line-height: 24px; box-sizing: border-box; overflow: hidden;">
<header style="display: flex; align-items: flex-end; gap: 24px 32px; padding: 24px 24px 23px; border-bottom: 1px solid oklch(89% 0.006 95); max-width: 1312px; margin: 0 auto; box-sizing: border-box;">
  <p style="margin: 0; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; font-size: 16px; line-height: 24px;"><span aria-hidden="true" style="margin-right: 8px;">🎛️</span><a href="#" style="text-decoration: none; color: oklch(18% 0.006 95);">Chassis</a></p>
  <nav style="display: flex; flex: 1; align-items: flex-end; gap: 24px;">
    <details style="position: relative;"><summary style="list-style: none; cursor: pointer; white-space: nowrap; color: oklch(18% 0.006 95); font-weight: 700; font-size: 16px; line-height: 24px;"><span aria-hidden="true" style="margin-right: 8px;">🧰</span>Tools<span style="color: oklch(54% 0.006 95); font-weight: 400;"> ▾</span></summary></details>
    <span style="flex: 1;"></span>
    <a href="#" style="text-decoration: none; color: oklch(54% 0.006 95); font-weight: 400; font-size: 16px; line-height: 24px;">Account</a>
  </nav>
</header>
<nav style="background: oklch(94% 0.006 95); box-shadow: inset 0 -1px 0 oklch(89% 0.006 95);">
  <div style="display: flex; align-items: flex-end; gap: 24px 32px; padding: 24px; max-width: 1312px; margin: 0 auto; box-sizing: border-box;">
    <a href="#" style="text-decoration: none; color: oklch(54% 0.006 95); font-weight: 700; font-size: 16px; line-height: 24px;"><span aria-hidden="true" style="margin-right: 8px;">🦡</span>Badger</a>
    <a href="#" aria-current="page" style="text-decoration: none; color: #e30613; font-weight: 700; font-size: 16px; line-height: 24px;">Badges</a>
  </div>
</nav>
<main style="max-width: 1312px; margin: 0 auto; padding: 0 24px; box-sizing: border-box;">
  <div style="padding: 24px 0 0;">
    <h1 style="margin: 0; font-size: 48px; line-height: 72px; font-weight: 700; letter-spacing: -0.028em;">Compose a badge</h1>
    <p style="margin: 24px 0 0; max-width: 620px; font-size: 16px; line-height: 24px;">Start from a composition, not a blank document. Each one is a container that derives regions and type set into them; everything on it can be changed once it is on the board.</p>
  </div>
  <div style="padding-top: 24px;">
    <p style="margin: 0 0 24px; font-size: 12px; line-height: 24px; font-weight: 700; color: oklch(54% 0.006 95);">Composition</p>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 24px;">
      <button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; text-align: left; display: flex; flex-direction: column; gap: 0; padding: 24px 24px 23px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95);">
    <div style="padding-bottom: 24px;"><svg width="120" height="100" viewBox="0 0 120 100" style="display: block;"><ellipse cx="60" cy="50" rx="52" ry="40" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/><ellipse cx="60" cy="50" rx="34" ry="24" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/><path d="M22 50a38 28 0 0 1 76 0" stroke="oklch(54% 0.006 95)" fill="none" stroke-width="1" stroke-dasharray="3 3"/></svg></div>
    <span style="font-size: 16px; line-height: 24px; font-weight: 700;">Ring</span>
    <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">Type follows the band over the top and back under the bottom; a pair holds the sides.</span>
    <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">After Stockholm Stadion</span>
  </button>
      <button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; text-align: left; display: flex; flex-direction: column; gap: 0; padding: 24px 24px 23px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95);">
    <div style="padding-bottom: 24px;"><svg width="120" height="100" viewBox="0 0 120 100" style="display: block;"><ellipse cx="60" cy="50" rx="52" ry="40" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/><ellipse cx="60" cy="50" rx="40" ry="30" stroke="oklch(54% 0.006 95)" fill="none" stroke-width="1" stroke-dasharray="3 3"/><circle cx="60" cy="50" r="14" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/></svg></div>
    <span style="font-size: 16px; line-height: 24px; font-weight: 700;">Medallion</span>
    <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">A ring with a child container in the field: one letter or a mark.</span>
    <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">After Salt &amp; Sierra</span>
  </button>
      <button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; text-align: left; display: flex; flex-direction: column; gap: 0; padding: 24px 24px 23px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95);">
    <div style="padding-bottom: 24px;"><svg width="120" height="100" viewBox="0 0 120 100" style="display: block;"><path d="M60 8 L84 50 L60 92 L36 50 Z" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/><path d="M48 32h24M42 50h36M48 68h24" stroke="oklch(54% 0.006 95)" fill="none" stroke-width="1" stroke-dasharray="3 3"/></svg></div>
    <span style="font-size: 16px; line-height: 24px; font-weight: 700;">Lozenge stack</span>
    <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">Lines down a tall lozenge, each taking the chord at its height.</span>
    <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">After Le Dive</span>
  </button>
      <button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; text-align: left; display: flex; flex-direction: column; gap: 0; padding: 24px 24px 23px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95);">
    <div style="padding-bottom: 24px;"><svg width="120" height="100" viewBox="0 0 120 100" style="display: block;"><path d="M8 50 L60 20 L112 50 L60 80 Z" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/><path d="M16 50 L60 26 L104 50 L60 74 Z" stroke="oklch(54% 0.006 95)" fill="none" stroke-width="1" stroke-dasharray="3 3"/><path d="M28 50h64" stroke="oklch(54% 0.006 95)" fill="none" stroke-width="1" stroke-dasharray="3 3"/></svg></div>
    <span style="font-size: 16px; line-height: 24px; font-weight: 700;">Wide word</span>
    <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">One word across a wide lozenge, each letter the chord at its position.</span>
    <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">After Giletti</span>
  </button>
      <button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; text-align: left; display: flex; flex-direction: column; gap: 0; padding: 24px 24px 23px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95);">
    <div style="padding-bottom: 24px;"><svg width="120" height="100" viewBox="0 0 120 100" style="display: block;"><path d="M20 12h80v40c0 20-20 32-40 40C40 84 20 72 20 52z" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/><path d="M28 20h64" stroke="oklch(54% 0.006 95)" fill="none" stroke-width="1" stroke-dasharray="3 3"/><path d="M28 30h64" stroke="oklch(54% 0.006 95)" fill="none" stroke-width="1" stroke-dasharray="3 3"/></svg></div>
    <span style="font-size: 16px; line-height: 24px; font-weight: 700;">Shield band</span>
    <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">A straight top edge to set along, and a field below it.</span>
    <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">&nbsp;</span>
  </button>
      <button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; text-align: left; display: flex; flex-direction: column; gap: 0; padding: 24px 24px 23px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95);">
    <div style="padding-bottom: 24px;"><svg width="120" height="100" viewBox="0 0 120 100" style="display: block;"><rect x="12" y="20" width="96" height="60" rx="8" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/><path d="M24 36h72M24 50h72M24 64h48" stroke="oklch(54% 0.006 95)" fill="none" stroke-width="1" stroke-dasharray="3 3"/></svg></div>
    <span style="font-size: 16px; line-height: 24px; font-weight: 700;">Plate</span>
    <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">A rounded plate with a block of lines and a knocked-out patch.</span>
    <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">&nbsp;</span>
  </button>
    </div>
  </div>
  <div style="display: flex; align-items: flex-end; gap: 24px; padding-top: 24px;">
    <div>
      <p style="margin: 0 0 24px; font-size: 12px; line-height: 24px; font-weight: 700; color: oklch(54% 0.006 95);">Shape</p>
      <div style="display: flex; gap: 8px;"><button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 12px 12px 11px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95); font-size: 12px; line-height: 24px;"><svg width="48" height="40" viewBox="0 0 48 40"><circle cx="24" cy="20" r="16" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/></svg>Circle</button><button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 12px 12px 11px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95); font-size: 12px; line-height: 24px;"><svg width="48" height="40" viewBox="0 0 48 40"><ellipse cx="24" cy="20" rx="20" ry="13" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/></svg>Ellipse</button><button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 12px 12px 11px; border: 0; cursor: pointer; background: oklch(94% 0.006 95); box-shadow: inset 0 0 0 1px oklch(18% 0.006 95); color: oklch(18% 0.006 95); font-size: 12px; line-height: 24px;"><svg width="48" height="40" viewBox="0 0 48 40"><path d="M24 4c14 0 20 6 20 16s-6 16-20 16S4 30 4 20 10 4 24 4z" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/></svg>Superellipse</button><button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 12px 12px 11px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95); font-size: 12px; line-height: 24px;"><svg width="48" height="40" viewBox="0 0 48 40"><rect x="5" y="8" width="38" height="24" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/></svg>Rectangle</button><button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 12px 12px 11px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95); font-size: 12px; line-height: 24px;"><svg width="48" height="40" viewBox="0 0 48 40"><rect x="5" y="8" width="38" height="24" rx="6" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/></svg>Rounded</button><button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 12px 12px 11px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95); font-size: 12px; line-height: 24px;"><svg width="48" height="40" viewBox="0 0 48 40"><path d="M24 4L44 20 24 36 4 20z" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/></svg>Lozenge</button><button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 12px 12px 11px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95); font-size: 12px; line-height: 24px;"><svg width="48" height="40" viewBox="0 0 48 40"><path d="M8 5h32v15c0 8-8 13-16 16-8-3-16-8-16-16z" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5"/></svg>Shield</button><button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 12px 12px 11px; border: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1px oklch(89% 0.006 95); color: oklch(18% 0.006 95); font-size: 12px; line-height: 24px;"><svg width="48" height="40" viewBox="0 0 48 40"><path d="M6 30C10 6 22 4 26 14s10 8 16 2" stroke="oklch(18% 0.006 95)" fill="none" stroke-width="1.5" stroke-dasharray="3 3"/></svg>Path…</button></div>
    </div>
    <span style="flex: 1;"></span>
    <div style="display: flex; align-items: center; gap: 16px;">
      <button style="font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px; border: 0; padding: 12px 16px; cursor: pointer; white-space: nowrap; background: oklch(18% 0.006 95); color: oklch(98% 0.006 95);">Compose a ring on a superellipse</button>
      <span style="font-size: 12px; line-height: 24px; color: oklch(54% 0.006 95);">Or <a href="#" style="color: oklch(54% 0.006 95);">paste a document</a>.</span>
    </div>
  </div>
</main>
</div>
</x-dc>
</body>
</html>
