# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

AllCops:
  Exclude:
    # Generated by the Projects engine's dummy application's migrations. The
    # engine is linted with the chassis — one repository, one house style —
    # so its generated files are excluded here too.
    - engines/*/test/dummy/db/schema.rb
